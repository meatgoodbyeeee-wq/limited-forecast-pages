name: TEMP card data field check (TDM)
on:
  push:
    branches: [fra-card-data]
    paths: ['.github/workflows/tmp-card-data-fields.yml']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp-fields
          curl -sS -A 'Sakiyomi/1.0 (limited forecast research)' 'https://www.17lands.com/api/card_data?expansion=TDM&event_type=PremierDraft&start_date=2025-04-08&end_date=2025-05-05' | python3 -c "import json,sys;d=json.load(sys.stdin);r=d if isinstance(d,list) else d.get('data',[]);print(type(d).__name__,len(r));print(json.dumps(r[0],indent=1)[:2500])" > tmp-fields/out.txt 2>&1
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-fields && git commit -m 'TEMP field check' && git push origin HEAD:fra-card-data
