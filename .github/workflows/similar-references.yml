name: Build similar-card references
# Manual: rebuilds the 22-set similar-card candidates, recomputes each card's similar cards
# in public/forecast.json.gz, and refreshes their Japanese names.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_similar_references.py'
      - 'scripts/recompute-similar.mjs'
      - '.github/workflows/similar-references.yml'
permissions:
  contents: write
concurrency:
  group: similar-references
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: meatgoodbyeeee-wq/17lands-limited-forecast-data
          path: data-source
          sparse-checkout: data/features
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_similar_references.py data-source/data/features/dev_feature_22.csv.gz data/similar-references.json.gz
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/recompute-similar.mjs
      - run: node scripts/fetch-japanese-text.mjs
      - name: Commit references, similar cards and Japanese names
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/similar-references.json.gz public/forecast.json.gz data/card-text-ja.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild similar-card references (22 sets)'
          git push origin HEAD:${GITHUB_REF_NAME}
