name: Build similar-card references
# Manual: rebuilds the 22-set similar-card candidates, recomputes each card's similar cards
# in public/forecast.json.gz, and refreshes their Japanese names.
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_similar_references.py'
      - 'scripts/recompute-similar.mjs'
      - '.github/workflows/similar-references.yml'
permissions:
  contents: write
concurrency:
  group: card-text-ja-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/checkout@v4
        with:
          repository: meatgoodbyeeee-wq/17lands-limited-forecast-data
          path: data-source
          sparse-checkout: |
            data/features
            data/compact_28d
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_similar_references.py data-source/data/features/dev_feature_22.csv.gz data/similar-references.json.gz data-source/data/compact_28d
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/recompute-similar.mjs
      - run: node scripts/fetch-japanese-text.mjs
      - name: Commit references, similar cards and Japanese names
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/similar-references.json.gz public/forecast.json.gz data/card-text-ja.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Rebuild similar-card references (22 sets)'
          # Another data workflow may have pushed meanwhile: rebase onto it and retry.
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo 'push failed after retries' >&2; exit 1
