name: Fetch Japanese card text
# Manual: refreshes data/card-text-ja.json (official Japanese FRA text + Japanese names of past-set similar cards).
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-japanese-text.mjs'
      - '.github/workflows/japanese-text.yml'
permissions:
  contents: write
concurrency:
  group: japanese-text
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-japanese-text.mjs
      - name: Commit updated Japanese text
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/card-text-ja.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Japanese card text'
          git push origin HEAD:${GITHUB_REF_NAME}
