name: Fetch Japanese card text
# Manual: refreshes data/card-text-ja.json (official Japanese FRA text + Japanese names of past-set similar cards).
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-japanese-text.mjs'
      - '.github/workflows/japanese-text.yml'
permissions:
  contents: write
concurrency:
  group: card-text-ja-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-japanese-text.mjs
      - name: Commit updated Japanese text
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/card-text-ja.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Japanese card text'
          # Another data workflow may have pushed meanwhile: rebase onto it and retry.
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo 'push failed after retries' >&2; exit 1
