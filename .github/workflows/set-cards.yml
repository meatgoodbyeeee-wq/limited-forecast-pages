name: Collect set cards
# (preview branch trk-b10-preview: collection also runs on pushes that touch this file; re-run 2026-10-26 for new previews)
# NOTE: automatic runs are stopped for TRK (every card is published); manual runs only.
# Reads the revealed cards of a set that is not out yet (TRK) from Wizards' official card gallery into data/<code>/target.json.gz.
# GitHub Actions only: the cloud sandbox cannot reach Wizards. The daily run is at 05:37 JST, before the 06:07 JST site build.
# Failures keep the stored cards (see data/<code>/collect-state.json for the reason and the gallery used).
on:
  # All TRK cards are out (2026-10-31): the daily run and the push trigger are off. Run it by hand (workflow_dispatch) for a future set.
  workflow_dispatch:
    inputs:
      set:
        description: 'Set code (see lib/set-config.mjs)'
        default: 'TRK'
permissions:
  contents: write
  actions: write
concurrency:
  group: set-cards
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SET_CODE: ${{ inputs.set || 'TRK' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/collect-set-cards.mjs "$SET_CODE"
      # Card images are downloaded here, ahead of time, and stored in the repository (the site never hot-links Wizards).
      - run: node scripts/fetch-set-images.mjs "$SET_CODE"
        if: env.SET_CODE != 'FRA'
      - name: Save the cards and redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="data/$(echo "$SET_CODE" | tr A-Z a-z)"
          git add "$dir/target.json.gz" "$dir/collect-state.json" "$dir/card-images.json" "$dir/ja-state.json" "$dir/images" 2>/dev/null || true
          if git diff --cached --quiet; then echo 'nothing to save'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update $SET_CODE card list"
          git push origin HEAD:${GITHUB_REF_NAME}
          if [ "${GITHUB_REF_NAME}" = "main" ]; then gh workflow run pages.yml --ref main; fi
