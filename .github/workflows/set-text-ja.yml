name: Collect Japanese set text
# Reads the official Japanese type line and rules text of a set that is not out yet (TRK) into data/<code>/card-text-ja.json.
# GitHub Actions only: the cloud sandbox cannot reach Wizards. Manual runs only (plus one run on the branch that added it).
on:
  workflow_dispatch:
    inputs:
      set:
        description: 'Set code (see lib/set-config.mjs)'
        default: 'TRK'
  push:
    branches: [claude/trk-text-ja]
    paths: ['.github/workflows/set-text-ja.yml']
permissions:
  contents: write
concurrency:
  group: set-text-ja
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SET_CODE: ${{ inputs.set || 'TRK' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-set-text-ja.mjs "$SET_CODE"
      - name: Save the text
        run: |
          dir="data/$(echo "$SET_CODE" | tr A-Z a-z)"
          git add "$dir/card-text-ja.json"
          if git diff --cached --quiet; then echo 'nothing to save'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update $SET_CODE Japanese card text"
          git push origin HEAD:${GITHUB_REF_NAME}
