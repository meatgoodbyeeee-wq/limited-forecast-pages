name: FRA Color Ratings (daily)
# Once a day at about 00:35 JST. The script itself refuses to call 17Lands before
# 2026-10-13 00:00 JST, calls at most once per JST day, and stops after the 28-day window.
on:
  schedule:
    - cron: '35 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: fra-color-ratings
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-color-ratings.mjs
      - name: Save snapshot and redeploy the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in public/data/fra-actual-color-ratings.json data/color-ratings-state.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then echo 'nothing to save'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update FRA Color Ratings snapshot'
          git push origin HEAD:${GITHUB_REF_NAME}
          if [ "${GITHUB_REF_NAME}" = "main" ]; then gh workflow run pages.yml --ref main; fi
