name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: meatgoodbyeeee-wq/17lands-limited-forecast-data
          path: image-source
          sparse-checkout: |
            assets/fra/ja
            live
      - run: mkdir -p public/cards/fra/ja && cp -R image-source/assets/fra/ja/. public/cards/fra/ja/
      - run: mkdir -p public/live && cp image-source/live/fra-public-game.json public/live/fra-public-game.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: gunzip -k public/forecast.json.gz
      - run: for file in data/{target,model,adopted-gih-fra,live-policy}.json.gz; do gunzip -k "$file"; done
      - run: node scripts/refresh-forecast.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
