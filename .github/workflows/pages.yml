name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Once a day at 06:07 JST (21:07 UTC), after the data repo's 02:23 JST public-data check.
    - cron: "7 21 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: meatgoodbyeeee-wq/17lands-limited-forecast-data
          path: image-source
          sparse-checkout: |
            assets/fra/ja
            live
      - run: mkdir -p public/cards/fra/ja && cp -R image-source/assets/fra/ja/. public/cards/fra/ja/
      - name: Copy downloaded card images of other sets
        run: for d in data/*/images; do [ -d "$d" ] || continue; c=$(basename "$(dirname "$d")"); mkdir -p "public/cards/$c" && cp -R "$d"/. "public/cards/$c/"; done
      - run: mkdir -p public/live && cp image-source/live/fra-public-game.json public/live/fra-public-game.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: gunzip -k public/forecast.json.gz
      - run: for file in data/{target,model,adopted-gih-fra,live-policy}.json.gz; do gunzip -k "$file"; done
      - run: node scripts/refresh-forecast.mjs
      # Other sets: built only once the adopted GIH files from the data repository are in data/<code>/, and only for sets
      # marked available in lib/set-config.mjs (that flag is the publishing switch).
      - name: Build forecasts for other sets
        run: |
          for f in data/*/adopted-gih.json.gz; do
            [ -f "$f" ] || continue
            node scripts/build-set-forecast.mjs "$(basename "$(dirname "$f")" | tr a-z A-Z)"
          done
      - run: node scripts/fetch-about-feeds.mjs || true
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
