name: TEMP 17Lands ALSA API format test
on:
  push:
    branches: [observed-alsa]
    paths: ['.github/workflows/alsa-api-test.yml']
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ALSA_TEST_SET=TDM ALSA_TEST_START=2025-04-08 ALSA_TEST_END=2025-05-05 node scripts/fetch-17lands-alsa.mjs | tee alsa-test-log.txt
      - run: |
          mkdir -p tmp-alsa-test && cp alsa-test-log.txt tmp-alsa-test/ && (head -c 3000 public/live/fra-alsa.json > tmp-alsa-test/sample.json || echo none > tmp-alsa-test/sample.json)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-alsa-test && git commit -m 'TEMP ALSA API test output' && git push origin HEAD:observed-alsa
